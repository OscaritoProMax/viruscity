<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="color-scheme" content="dark">
<title>Viruscity · Iniciar sesión</title>
<link rel="icon" type="image/svg+xml" href="img/favicon.svg">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/login.css">
</head>
<body>
<main class="login">
    <!-- Columna izquierda: identidad del juego -->
    <section class="hero" aria-hidden="false">
        <canvas id="heroParticles" class="hero__particles" aria-hidden="true"></canvas>
        <div class="hero__content">
            <img class="hero__logo" src="img/logo.svg" width="72" height="72" alt="Logo de Viruscity">
            <h1 class="wordmark" aria-label="Viruscity">
                <span class="wordmark__virus" aria-hidden="true">VIRUS</span><span class="wordmark__city" aria-hidden="true">CITY</span>
            </h1>
            <p class="hero__tagline">Encuentra al infectado. Fabrica la cura.</p>
            <ul class="hero__chips" aria-label="Características">
                <li class="chip">4+ jugadores</li>
                <li class="chip">Un infectado oculto</li>
                <li class="chip">Una cura para todos</li>
            </ul>
        </div>
    </section>

    <!-- Columna derecha: autenticación -->
    <section class="auth card" aria-labelledby="authTitle">
        <h2 id="authTitle" class="sr-only">Acceso a Viruscity</h2>

        <!-- Aviso que deja el lobby al cerrar la sesión (token vencido, sesión duplicada, conexión perdida).
             login.js lo rellena desde sessionStorage y lo muestra quitando "hidden". -->
        <div id="sessionBanner" class="banner" role="alert" hidden></div>

        <div class="tabs" role="tablist" aria-label="Acceso">
            <button class="tabs__tab" type="button" role="tab" id="tabLogin" aria-selected="true" aria-controls="panelLogin" tabindex="0">Iniciar sesión</button>
            <button class="tabs__tab" type="button" role="tab" id="tabRegister" aria-selected="false" aria-controls="panelRegister" tabindex="-1">Crear cuenta</button>
        </div>

        <!-- Panel: iniciar sesión -->
        <div class="tabs__panel" role="tabpanel" id="panelLogin" aria-labelledby="tabLogin">
            <form id="loginForm" class="auth__form" novalidate>
                <div class="field">
                    <label for="loginUsername">Usuario</label>
                    <input id="loginUsername" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
                </div>
                <div class="field">
                    <label for="loginPassword">Contraseña</label>
                    <div class="field__control">
                        <input id="loginPassword" name="password" type="password" autocomplete="current-password" required>
                        <button class="field__toggle" type="button" aria-controls="loginPassword" aria-pressed="false" aria-label="Mostrar contraseña">
                            <svg class="icon-eye" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
                            <svg class="icon-eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path d="M4 4l16 16"/></svg>
                        </button>
                    </div>
                </div>
                <button class="btn btn--block" type="submit">Entrar</button>
                <p class="msg" id="loginMessage" role="status" aria-live="polite"></p>
            </form>
        </div>

        <!-- Panel: crear cuenta -->
        <div class="tabs__panel" role="tabpanel" id="panelRegister" aria-labelledby="tabRegister">
            <form id="registerForm" class="auth__form" novalidate>
                <div class="field">
                    <label for="registerUsername">Usuario</label>
                    <input id="registerUsername" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" aria-describedby="registerUsernameHint" required>
                    <p class="field__hint" id="registerUsernameHint">3 a 30 caracteres: letras, números o guion bajo</p>
                </div>
                <div class="field">
                    <label for="registerPassword">Contraseña</label>
                    <div class="field__control">
                        <input id="registerPassword" name="password" type="password" autocomplete="new-password" aria-describedby="registerPasswordHint" required>
                        <button class="field__toggle" type="button" aria-controls="registerPassword" aria-pressed="false" aria-label="Mostrar contraseña">
                            <svg class="icon-eye" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
                            <svg class="icon-eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path d="M4 4l16 16"/></svg>
                        </button>
                    </div>
                    <p class="field__hint" id="registerPasswordHint">6 a 72 caracteres</p>
                </div>
                <button class="btn btn--block" type="submit">Crear cuenta</button>
                <p class="msg" id="registerMessage" role="status" aria-live="polite"></p>
            </form>
        </div>

        <!-- Reservado para el inicio de sesión con Google (Taller 5): no se dibuja nada todavía -->
        <div id="googleSlot" hidden></div>

        <footer class="auth__footer">Proyecto final · Sistemas Distribuidos · Universidad de Boyacá</footer>
    </section>
</main>

<script src="/config.js"></script>
<script src="js/login.js"></script>
<script type="module" src="js/login-ui.js"></script>
</body>
</html>
