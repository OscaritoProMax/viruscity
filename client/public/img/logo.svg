<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Viruscity">
  <!-- Virus de Viruscity, con las proporciones del virus animado del login (radio base R = 28):
       anillo en 0.42R, antenas de 0.42R a 0.97R, núcleo de 0.2R y reflejo en el núcleo.
       Colores de tokens.css: acento #4dd2ff, fondo #0b1020 y texto #e6e9f5.
       (En XML no se permite el doble guion dentro de un comentario.) -->

  <!-- 8 antenas cada 45° -->
  <g stroke="#4dd2ff" stroke-width="2.43" stroke-linecap="round">
    <line x1="43.76" y1="32" x2="59.16" y2="32"/>
    <line x1="40.32" y1="40.32" x2="51.21" y2="51.21"/>
    <line x1="32" y1="43.76" x2="32" y2="59.16"/>
    <line x1="23.68" y1="40.32" x2="12.79" y2="51.21"/>
    <line x1="20.24" y1="32" x2="4.84" y2="32"/>
    <line x1="23.68" y1="23.68" x2="12.79" y2="12.79"/>
    <line x1="32" y1="20.24" x2="32" y2="4.84"/>
    <line x1="40.32" y1="23.68" x2="51.21" y2="12.79"/>
  </g>

  <!-- Nodos de las antenas -->
  <g fill="#4dd2ff">
    <circle cx="59.16" cy="32" r="3.35"/>
    <circle cx="51.21" cy="51.21" r="3.35"/>
    <circle cx="32" cy="59.16" r="3.35"/>
    <circle cx="12.79" cy="51.21" r="3.35"/>
    <circle cx="4.84" cy="32" r="3.35"/>
    <circle cx="12.79" cy="12.79" r="3.35"/>
    <circle cx="32" cy="4.84" r="3.35"/>
    <circle cx="51.21" cy="12.79" r="3.35"/>
  </g>

  <!-- Punto oscuro dentro de cada nodo -->
  <g fill="#0b1020">
    <circle cx="59.16" cy="32" r="1.34"/>
    <circle cx="51.21" cy="51.21" r="1.34"/>
    <circle cx="32" cy="59.16" r="1.34"/>
    <circle cx="12.79" cy="51.21" r="1.34"/>
    <circle cx="4.84" cy="32" r="1.34"/>
    <circle cx="12.79" cy="12.79" r="1.34"/>
    <circle cx="32" cy="4.84" r="1.34"/>
    <circle cx="51.21" cy="12.79" r="1.34"/>
  </g>

  <!-- Anillo del cuerpo -->
  <circle cx="32" cy="32" r="11.76" fill="none" stroke="#4dd2ff" stroke-width="3.04"/>

  <!-- Núcleo con reflejo -->
  <circle cx="32" cy="32" r="5.6" fill="#4dd2ff"/>
  <circle cx="30.6" cy="30.6" r="1.96" fill="#e6e9f5" fill-opacity="0.7"/>
</svg>
